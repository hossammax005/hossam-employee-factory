name: E1 Foundation Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [mission-02/e1-data-integrity-hardening]
permissions:
  contents: read
jobs:
  e1-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run E1 tests
        run: node --test test/e1.test.js
